spring.application.name=platform

# Every request DTO is a Java record; keep omitted optional primitives falling back to defaults.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --- Datasource ---
# Per-statement and idle-in-transaction timeouts keep one slow tenant query from tying up the pool for everyone.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:platform_dev}?options=-c%20statement_timeout=30000%20-c%20idle_in_transaction_session_timeout=60000
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# migrations may legitimately run long (index builds on big tables)
spring.flyway.init-sqls=SET statement_timeout = 0

# --- JPA / Hibernate --- Flyway owns the schema; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Proxy headers (backend is only reachable through the reverse proxy) ---
server.forward-headers-strategy=none
management.endpoint.health.probes.enabled=true

# --- Platform / tenancy ---
# Root domain tenants get subdomains of: <slug>.<root-domain>. Locally *.localtest.me resolves to 127.0.0.1.
app.platform.root-domain=${PLATFORM_ROOT_DOMAIN:platform.localtest.me}
# Hosts of the platform itself (marketing site, signup, platform admin) - comma separated, in addition to root-domain.
app.platform.extra-hosts=${PLATFORM_EXTRA_HOSTS:localhost,127.0.0.1}
# Trust X-Forwarded-Host (set by our reverse proxy / Next.js server) when resolving the tenant.
app.platform.trust-forwarded-host=${TRUST_FORWARDED_HOST:true}
# CNAME target shown to tenants adding a custom domain.
app.platform.edge-host=${PLATFORM_EDGE_HOST:edge.platform.localtest.me}
# Public IP of the server: shown as the A record a custom domain's owner creates (a root domain cannot be a CNAME). Empty = show the CNAME instruction.
app.platform.edge-ip=${PLATFORM_EDGE_IP:}
# clinics and lawyers: the first month is free (shops have no subscription)
app.platform.trial-days=30

# --- Auth / JWT --- base64 key >= 256 bits. Generate with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:Q0hBTkdFX01FX2Rldl9vbmx5X3NlY3JldF9DSEFOR0VfTUVfZGV2X29ubHk=}
app.jwt.access-token-ttl=PT15M
# Sliding: every refresh starts a new 90 days, so only an app unused for 90 days signs out.
app.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:P90D}
app.auth.activation-pin-ttl=P7D
app.auth.max-activation-attempts=5

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Billing ---
# Shared secret the (mock) payment provider signs webhooks with. Real gateways bring their own secret.
app.billing.webhook-secret=${BILLING_WEBHOOK_SECRET:dev-only-webhook-secret-change-me}
app.billing.grace-days=14

# --- Files ---
app.files.dir=${FILES_DIR:./uploads}

# --- Notifications ---
# E-mail is optional and free of per-message cost; SMS/WhatsApp stay disabled (paid add-ons). Leave off in dev: messages are only logged.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@platform.local}

# --- Hardening ---
app.ratelimit.enabled=${RATE_LIMIT_ENABLED:true}
# API docs are a development aid: off unless explicitly enabled (dev profile turns them on).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
# First platform owner, created at startup only when both are set (env/secret manager, never committed).
app.platform.admin-phone=${PLATFORM_ADMIN_PHONE:}
app.platform.admin-password=${PLATFORM_ADMIN_PASSWORD:}

# --- Payments ---
# Online card payments are off: stores take cash on delivery, clinics take cash at the clinic.
app.payments.card-enabled=${CARD_PAYMENTS_ENABLED:false}

# --- Patient accounts (portal, patient login) ---
# Off for now: the clinic works from its own dashboard. Set PATIENT_PORTAL_ENABLED=true to bring patient accounts back.
app.patient-portal.enabled=${PATIENT_PORTAL_ENABLED:true}
# Online booking by patients is off until the business model is ready.
app.booking.enabled=${BOOKING_ENABLED:false}
# Google sign-in for shop clients and Firebase push for patients are optional: leave empty until configured.
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.fcm.credentials-file=${FCM_CREDENTIALS_FILE:}

# --- Object storage ---
# local: files on disk (dev). s3: any S3-compatible store (MinIO, Garage, R2, AWS S3). Public images are served from the public bucket through the edge proxy at /media.
app.storage.type=${STORAGE_TYPE:local}
app.storage.public-path=${STORAGE_PUBLIC_PATH:/media}
app.storage.s3.endpoint=${S3_ENDPOINT:}
app.storage.s3.region=${S3_REGION:us-east-1}
app.storage.s3.access-key=${S3_ACCESS_KEY:}
app.storage.s3.secret-key=${S3_SECRET_KEY:}
app.storage.s3.public-bucket=${S3_PUBLIC_BUCKET:public-media}
app.storage.s3.private-bucket=${S3_PRIVATE_BUCKET:private-medical}

# --- Connection pool (per backend instance; PostgreSQL max_connections must cover instances x pool size) ---
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.max-lifetime=1500000

# --- Redis (shared rate limits). Off for single-node/dev: limits then live in memory. ---
app.redis.enabled=${REDIS_ENABLED:false}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=500ms
management.health.redis.enabled=${REDIS_ENABLED:false}

# --- Observability ---
# Metrics are for the monitoring system on the internal network only: the edge proxy never routes /actuator.
management.endpoints.web.exposure.include=health,prometheus
management.metrics.tags.application=platform
logging.pattern.level=%5p [%X{requestId:-}|%X{tenantId:-}|%X{userId:-}]

# Gemini is used only to draw images (marketing); every text model of the platform is GLM (default) or Claude Haiku, see below.
app.ai.gemini.api-key=${GEMINI_API_KEY:}

# Meta (Facebook / Instagram / WhatsApp) for the AI assistant. The app secret signs webhooks; the verify token is typed into the Meta app once.
app.meta.app-id=${META_APP_ID:}
app.meta.app-secret=${META_APP_SECRET:}
app.meta.verify-token=${META_VERIFY_TOKEN:}
app.meta.graph-version=${META_GRAPH_VERSION:v21.0}
app.chat.token-key=${CHAT_TOKEN_KEY:}
app.meta.login-config-id=${META_LOGIN_CONFIG_ID:}

# Optional unofficial WhatsApp mode through a self-hosted Evolution API. Empty base url = the feature is not available on this server.
app.evolution.base-url=${EVOLUTION_BASE_URL:}
app.evolution.api-key=${EVOLUTION_API_KEY:}
app.evolution.webhook-secret=${EVOLUTION_WEBHOOK_SECRET:}
app.evolution.backend-url=${EVOLUTION_BACKEND_URL:http://backend:8080}
app.evolution.async=${EVOLUTION_ASYNC:true}
app.evolution.typing-delay-ms=${EVOLUTION_TYPING_DELAY_MS:1500}

# Open Store builds absolute picture links onto each shop's host. Only a local run changes these (e.g. http and 3000).
app.platform.public-scheme=${PUBLIC_SCHEME:https}
app.platform.public-port=${PUBLIC_PORT:}

# Claude (Haiku 5.5) as the assistant's model: AI_PROVIDER=anthropic plus ANTHROPIC_API_KEY. Prompt cache lives 1 hour because a shop gets a chat every few minutes.
app.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ai.anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
app.ai.anthropic.effort=${ANTHROPIC_EFFORT:low}
app.ai.anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com/v1}
app.ai.anthropic.cache-ttl=${ANTHROPIC_CACHE_TTL:1h}
app.ai.anthropic.max-output-tokens=${ANTHROPIC_MAX_OUTPUT_TOKENS:1500}
# A customer's messages typed within this many milliseconds are answered once, together (0 = answer every line); only when the webhook work is asynchronous.
app.chat.burst-ms=${CHAT_BURST_MS:5000}
# Prices of the Anthropic model for the admin cost estimate (USD per million tokens; Claude Haiku 5.5 up to 100K-token prompts; the 1-hour cache write costs double the input price)
# GLM-5.3-Flash through Hive (thehive.ai): the platform's default model, and picked in a chat with the command "glm". Thinking is "low": with "none" the model writes its
# English analysis into the reply, with the default it spends hundreds of hidden tokens; "low" answers directly.
app.ai.glm.api-key=${GLM_API_KEY:}
app.ai.glm.model=${GLM_MODEL:zai-org/glm-5.3-flash}
app.ai.glm.base-url=${GLM_BASE_URL:https://api-cdn.thehive.ai/api/v3}
app.ai.glm.reasoning-effort=${GLM_REASONING_EFFORT:low}
app.ai.price.glm.input=${AI_PRICE_GLM_INPUT:0.05}
app.ai.price.glm.output=${AI_PRICE_GLM_OUTPUT:0.17}
app.ai.price.glm.cached=${AI_PRICE_GLM_CACHED:0.01}
# Qwen3.7 Flash through Alibaba Cloud Model Studio (OpenAI-compatible mode; the key and the base URL belong to one region): picked in a chat with "alibaba" (or "qwen"), or by AI_ROUTE_SOCIAL / AI_ROUTE_WEB=qwen (falls back to the default model if it fails).
# Use the plain model name: the dated snapshot has a far lower limit in the US region. QWEN_THINKING=off (default) sends enable_thinking=false, on sends true, unset sends nothing (OpenRouter and other hosts read other settings).
app.ai.qwen.api-key=${QWEN_API_KEY:}
app.ai.qwen.model=${QWEN_MODEL:qwen3.7-flash}
app.ai.qwen.base-url=${QWEN_BASE_URL:https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
app.ai.qwen.thinking=${QWEN_THINKING:off}
# Sampling temperature per model (empty = the service default); lower sticks closer to the facts.
app.ai.glm.temperature=${GLM_TEMPERATURE:}
app.ai.qwen.temperature=${QWEN_TEMPERATURE:}
# calls a second each service accepts (Hive: 5 for GLM); a burst waits a moment instead of failing with 429. 0 = no limit
app.ai.glm.max-rps=${GLM_MAX_RPS:5}
# the AI features without a model of their own (shop builder, translation, product import, Copilot, marketing text, broadcasts): glm, or qwen (Alibaba first, GLM when it fails)
app.ai.features=${AI_FEATURES:glm}
app.ai.qwen.max-rps=${QWEN_MAX_RPS:0}
# How many earlier messages of a chat the seller model reads (more = a little more input per call, older details can mislead).
app.ai.history-messages=${AI_HISTORY:12}
# Photos and voice notes from customers (WhatsApp, Messenger, Instagram) are read into text on the Qwen key and workspace above: photos by the chat model itself (Qwen 3.5+
# sees images), voice notes by Qwen speech recognition (named qwen3-asr-flash-us in a US workspace). AI_MEDIA=false keeps the old "please type" answer.
app.ai.media.enabled=${AI_MEDIA:true}
app.ai.media.vision-model=${AI_MEDIA_VISION_MODEL:${QWEN_MODEL:qwen3.7-flash}}
app.ai.media.asr-model=${AI_MEDIA_ASR_MODEL:qwen3-asr-flash}
# Search by meaning (RAG) for the AI seller: any OpenAI-compatible /embeddings endpoint (Alibaba Model Studio Singapore by default). Without EMBED_API_KEY it is off and the seller searches by words.
# The vectors are kept in chat.knowledge_chunks and searched in memory per shop; prices and stock never go into them (always read from the catalog).
app.ai.embed.api-key=${EMBED_API_KEY:}
app.ai.embed.base-url=${EMBED_BASE_URL:https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
app.ai.embed.model=${EMBED_MODEL:qwen3.7-text-embedding}
app.ai.embed.dimensions=${EMBED_DIMENSIONS:512}
app.ai.embed.batch=${EMBED_BATCH:10}
app.ai.embed.min-score=${EMBED_MIN_SCORE:0.3}
app.ai.price.qwen.input=${AI_PRICE_QWEN_INPUT:0.03}
app.ai.price.qwen.output=${AI_PRICE_QWEN_OUTPUT:0.13}
app.ai.price.qwen.cached=${AI_PRICE_QWEN_CACHED:0.006}
# DeepSeek V4.1 Flash 1017 through Hive (picked from the website chat's test dropdown or by the command "deepseek"), also the first reader of customers' photos and voice notes.
# The key falls back to GLM_API_KEY (same Hive account). Thinking must be off (reasoning_effort none): with it on the model spends its whole output limit thinking.
app.ai.deepseek.api-key=${DEEPSEEK_API_KEY:${GLM_API_KEY:}}
app.ai.deepseek.model=${DEEPSEEK_MODEL:deepseek-ai/deepseek-v4.1-flash-1017}
app.ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api-cdn.thehive.ai/api/v3}
app.ai.deepseek.reasoning-effort=${DEEPSEEK_REASONING_EFFORT:none}
app.ai.deepseek.extra-body=${DEEPSEEK_EXTRA_BODY:}
app.ai.deepseek.max-rps=${DEEPSEEK_MAX_RPS:5}
app.ai.price.deepseek.input=${AI_PRICE_DEEPSEEK_INPUT:0.10}
app.ai.price.deepseek.output=${AI_PRICE_DEEPSEEK_OUTPUT:0.35}
app.ai.price.deepseek.cached=${AI_PRICE_DEEPSEEK_CACHED:0.003}
# a customer's photo (up to 5 MB) or voice note (up to 4 MB) from the website chat
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
# speech recognition of customers' voice notes (qwen3-asr-flash), USD per second of audio
app.ai.price.asr-per-second=${AI_PRICE_ASR_PER_SECOND:0.000035}
app.ai.price.anthropic.input=${AI_PRICE_ANTHROPIC_INPUT:0.10}
app.ai.price.anthropic.output=${AI_PRICE_ANTHROPIC_OUTPUT:0.50}
app.ai.price.anthropic.cached=${AI_PRICE_ANTHROPIC_CACHED:0.01}
app.ai.price.anthropic.cache-write=${AI_PRICE_ANTHROPIC_CACHE_WRITE:0.20}
# Which model answers customers: "default" (GLM), "qwen" or "anthropic" (Claude, needs ANTHROPIC_API_KEY; it falls back to the default model if it fails).
# social = WhatsApp, Facebook, Instagram and the shop's own WhatsApp number; web = the website chat and the dashboard test chat.
app.ai.route.social=${AI_ROUTE_SOCIAL:default}
app.ai.route.web=${AI_ROUTE_WEB:default}
# Chat replies are 1-3 sentences, but the model's short thinking and an order tool call count toward the same limit: 1000 leaves room without allowing long answers (other AI features are not affected).
app.ai.route.chat-max-output-tokens=${AI_ROUTE_CHAT_MAX_OUTPUT:1000}
# Test words: "ai-name" says which model answers the chat; "claude", "glm", "qwen" or "alibaba" switch that chat to the model (no model call). Turn on only while comparing models.
app.ai.name-probe=${AI_NAME_PROBE:false}
# A second look before each AI reply is sent: the same model checks the draft against the customer's words and the tool facts (who it is for, gender, wording, invented claims) and corrects it.
app.ai.review.enabled=${AI_REVIEW:true}
# The model that does that second look: empty = the answering model itself; "anthropic" = Claude Haiku checks every model's replies (better at spelling and wording, costs more).
app.ai.review.model=${AI_REVIEW_MODEL:}
# the scheduled quality check (AiEvalSchedule): nightly core set, full set on Sundays, on this shop, for these models; scores are compared and a drop is pushed to the platform owners
app.ai.eval.schedule=${AI_EVAL_SCHEDULE:false}
app.ai.eval.shop=${AI_EVAL_SHOP:layan-store}
app.ai.eval.models=${AI_EVAL_MODELS:glm,qwen}

# Points (1 point = 1 EGP, kept in piasters): an AI conversation costs 1 EGP per block of 10 AI replies; every outbound message (WhatsApp confirmation / reminder / offer / ad, Messenger and Instagram ad,
# AI comment reply, AI private message) costs 0.1 EGP, charged by billing.OutboundBilling
app.ai.conversation-price-minor=${AI_CONVERSATION_PRICE_MINOR:100}
app.ai.conversation-replies=${AI_CONVERSATION_REPLIES:10}
app.messages.price-minor=${MESSAGE_PRICE_MINOR:10}
app.whatsapp.message-price-minor=${app.messages.price-minor}
app.whatsapp.broadcast-price-minor=${app.messages.price-minor}
app.whatsapp.marketing-price-minor=${app.messages.price-minor}

# Broadcast pacing: a random gap between two messages (no daily cap: the shop's credit is the limit)
app.broadcast.free-gap-min-seconds=${BROADCAST_GAP_MIN_SECONDS:5}
app.broadcast.free-gap-max-seconds=${BROADCAST_GAP_MAX_SECONDS:15}

# Unofficial "manual style" sending to OLD Messenger / Instagram contacts (outside Meta's 24 h window, which the official API forbids for promotions).
# ON by default (round 5), no approval step. Instagram goes through the infra/ig-bridge sidecar (instagrapi), Messenger through infra/fb-bridge (fbchat-v2 acting as the Page).
# Verified only against fake transports: never against a real account. Ban risk can be lowered, never removed.
app.meta.unofficial.enabled=${META_UNOFFICIAL_ENABLED:true}
app.meta.unofficial.ig-bridge-url=${IG_BRIDGE_URL:}
app.meta.unofficial.ig-bridge-secret=${IG_BRIDGE_SECRET:}
app.meta.unofficial.fb-bridge-url=${FB_BRIDGE_URL:}
app.meta.unofficial.fb-bridge-secret=${FB_BRIDGE_SECRET:}
# a block signal keeps the account paused for this many hours (only the owner can bring it back, and not before)
app.meta.unofficial.block-hours=48
# gap between two messages: log-normal between min and max seconds, plus a random jitter (seconds)
app.meta.unofficial.gap-min-seconds=40
app.meta.unofficial.gap-max-seconds=120
app.meta.unofficial.jitter-max-seconds=15
# a longer break (seconds) after every N messages (N random in the range)
app.meta.unofficial.break-every-min=8
app.meta.unofficial.break-every-max=15
app.meta.unofficial.break-min-seconds=240
app.meta.unofficial.break-max-seconds=720
# caps (0 = off): per hour, per day after the warm-up; warm-up caps are the allowed messages on day 1, 2, 3 ... of the account
app.meta.unofficial.hourly-cap=25
app.meta.unofficial.max-daily=80
app.meta.unofficial.warmup-caps=10,15,20,30,40,50
# only inside these hours of the shop's time (from = to switches the window off)
app.meta.unofficial.active-from-hour=9
app.meta.unofficial.active-to-hour=21
# content rules and wordings
app.meta.unofficial.max-chars=500
app.meta.unofficial.max-links=1
app.meta.unofficial.max-emoji-repeat=3
app.meta.unofficial.min-variants=3
# typing simulation: ms per character plus a random base (ms) before the send
app.meta.unofficial.typing-ms-per-char=40
app.meta.unofficial.typing-base-min-ms=2000
app.meta.unofficial.typing-base-max-ms=6000
# audience limits and the owner-is-replying guard
app.meta.unofficial.max-contact-age-days=180
app.meta.unofficial.same-contact-days=30
app.meta.unofficial.min-messages=2
app.meta.unofficial.owner-reply-minutes=10

# COLD outreach (new customers: followers / commenters who never wrote to the page): a stricter profile than the old-contacts one above.
app.meta.unofficial.cold.gap-min-seconds=90
app.meta.unofficial.cold.gap-max-seconds=240
app.meta.unofficial.cold.jitter-max-seconds=20
app.meta.unofficial.cold.break-every-min=5
app.meta.unofficial.cold.break-every-max=9
app.meta.unofficial.cold.break-min-seconds=420
app.meta.unofficial.cold.break-max-seconds=1200
app.meta.unofficial.cold.hourly-cap=12
app.meta.unofficial.cold.max-daily=40
app.meta.unofficial.cold.warmup-caps=5,8,12,18,25,30
app.meta.unofficial.cold.active-from-hour=10
app.meta.unofficial.cold.active-to-hour=20
app.meta.unofficial.cold.min-variants=3
app.meta.unofficial.cold.same-contact-days=60

# New-customer prospects sync (Instagram followers + commenters through the ig-bridge, paced)
app.prospects.max-followers=3000
app.prospects.page-size=100
app.prospects.page-sleep-min-ms=2500
app.prospects.page-sleep-max-ms=6000
app.prospects.recent-posts=10
app.prospects.async=true

# The same human-like rules on the WhatsApp own-number route. The owner's gap (app.broadcast.free-gap-*, 5-15 s) and NO hard cap stay: hourly-cap and max-daily default to 0 = off.
# Quiet hours (app.broadcast.quiet-*) stay as they were; the active-hours window is off by default (from = to).
app.broadcast.whatsapp.hourly-cap=0
app.broadcast.whatsapp.max-daily=0
app.broadcast.whatsapp.active-from-hour=0
app.broadcast.whatsapp.active-to-hour=0
app.broadcast.whatsapp.break-every-min=40
app.broadcast.whatsapp.break-every-max=80
app.broadcast.whatsapp.break-min-seconds=60
app.broadcast.whatsapp.break-max-seconds=180
app.broadcast.whatsapp.typing-ms-per-char=40
app.broadcast.whatsapp.typing-cap-ms=4000
app.broadcast.whatsapp.typing-sleep=true
app.broadcast.whatsapp.max-chars=1000
app.broadcast.whatsapp.max-links=1
app.broadcast.whatsapp.owner-reply-minutes=10

# Messenger contact import (unofficial session): page size per bridge call, cap per run, pause between calls, async flag
app.contact-import.page-size=100
app.contact-import.max-contacts=5000
app.contact-import.page-sleep-min-ms=2500
app.contact-import.page-sleep-max-ms=6000
app.contact-import.async=true

# Domain purchases (buy a domain inside the dashboard): disabled by default - a ResellerClub reseller account, KYC
# and a funded deposit must exist and be verified against a real sandbox before this is ever turned on in production.
# While false, every purchase entry point refuses with REGISTRAR_NOT_CONFIGURED before the provider is ever called.
app.domains.registrar.enabled=${DOMAINS_REGISTRAR_ENABLED:false}
app.domains.resellerclub.user-id=${DOMAINS_RESELLERCLUB_USER_ID:}
app.domains.resellerclub.api-key=${DOMAINS_RESELLERCLUB_API_KEY:}
app.domains.resellerclub.use-sandbox=${DOMAINS_RESELLERCLUB_SANDBOX:true}
app.domains.resellerclub.sandbox-url=${DOMAINS_RESELLERCLUB_SANDBOX_URL:https://test.httpapi.com/api}
app.domains.resellerclub.live-url=${DOMAINS_RESELLERCLUB_LIVE_URL:https://httpapi.com/api}
app.domains.resellerclub.default-nameservers=${DOMAINS_RESELLERCLUB_DEFAULT_NS:ns1.resellerclub.test,ns2.resellerclub.test}
