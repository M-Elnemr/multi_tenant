name: platform_core
description: Shared API client, auth, tenant resolution and UI helpers for the customer, provider and patient apps.
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  animations: ^2.0.11
  sqflite: ^2.4.1
  path: ^1.9.1
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  assets:
    - assets/logo.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
