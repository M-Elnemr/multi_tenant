spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:platform_test}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
app.platform.root-domain=platform.test
app.platform.extra-hosts=localhost
app.platform.edge-host=edge.platform.test
app.ratelimit.enabled=false
app.payments.card-enabled=true
app.patient-portal.enabled=true
app.meta.app-secret=testsecret
app.meta.verify-token=verifytest
app.meta.async=false
app.meta.app-id=testappid
app.whatsapp.auto-confirm-interval-ms=86400000
app.whatsapp.auto-confirm-initial-delay-ms=86400000
app.integrations.scheduler.enabled=false
app.integrations.min-gap-ms=0
app.integrations.salla.client-id=salla-test-id
app.integrations.salla.client-secret=salla-test-secret
app.integrations.amazon.client-id=amzn-test-id
app.integrations.amazon.client-secret=amzn-test-secret
app.integrations.amazon.application-id=amzn1.sp.solution.test

app.whatsapp.platform.phone-id=999000111
app.whatsapp.platform.token=PLATFORM-TOKEN-0123456789
app.whatsapp.platform.number=+201000000000
app.evolution.base-url=http://evolution.test
app.evolution.api-key=evolution-test-key
app.evolution.webhook-secret=evolution-test-secret-0123456789
app.evolution.async=false
app.evolution.typing-delay-ms=0
app.broadcast.free-gap-min-seconds=0
app.broadcast.free-gap-max-seconds=0
app.broadcast.quiet-from-hour=0
app.broadcast.quiet-to-hour=0

# the reviewer is a second model call: tests script the model turn by turn, so it is on only where a test asks for it
app.ai.review.enabled=false
app.ai.embed.min-score=0.05

# The tests use the production prices: 0.1 EGP (10 piasters) per outbound message, 1 EGP per block of 10 AI replies
app.messages.price-minor=10

# manual-style sending: switched on for the tests, with no waiting (gaps, breaks, active hours) and no real typing sleeps; the unit tests build their own profiles
app.meta.unofficial.enabled=true
app.meta.unofficial.gap-min-seconds=0
app.meta.unofficial.gap-max-seconds=0
app.meta.unofficial.jitter-max-seconds=0
app.meta.unofficial.break-min-seconds=0
app.meta.unofficial.break-max-seconds=0
app.meta.unofficial.active-from-hour=0
app.meta.unofficial.active-to-hour=0
app.meta.unofficial.typing-base-min-ms=0
app.meta.unofficial.typing-base-max-ms=0
app.meta.unofficial.typing-ms-per-char=0
app.broadcast.whatsapp.typing-sleep=false
app.broadcast.whatsapp.break-min-seconds=0
app.broadcast.whatsapp.break-max-seconds=0

# cold outreach (prospects): no waiting either, caps wide enough for the tests
app.meta.unofficial.cold.gap-min-seconds=0
app.meta.unofficial.cold.gap-max-seconds=0
app.meta.unofficial.cold.jitter-max-seconds=0
app.meta.unofficial.cold.break-min-seconds=0
app.meta.unofficial.cold.break-max-seconds=0
app.meta.unofficial.cold.active-from-hour=0
app.meta.unofficial.cold.active-to-hour=0
app.meta.unofficial.cold.typing-base-min-ms=0
app.meta.unofficial.cold.typing-base-max-ms=0
app.meta.unofficial.cold.typing-ms-per-char=0
app.meta.unofficial.cold.warmup-caps=5,8,12
app.meta.unofficial.cold.hourly-cap=0
app.prospects.async=false
app.prospects.page-sleep-min-ms=0
app.prospects.page-sleep-max-ms=0

app.contact-import.async=false
app.contact-import.page-sleep-min-ms=0
app.contact-import.page-sleep-max-ms=0

# the existing prompt tests read the full rule book; the lean prompt is tested by choosing it through the AI configuration service
app.ai.default.prompt-mode=full
