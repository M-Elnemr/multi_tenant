services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-platform}
      POSTGRES_USER: ${DB_USERNAME:-platform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # Sized for ~1000 tenants on one box; raise shared_buffers/max_connections with the VPS (see docs/SCALE.md)
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=1536MB", "-c", "max_connections=200", "-c", "work_mem=8MB", "-c", "random_page_cost=1.1"]
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-platform} -d ${DB_NAME:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/m-elnemr/multi_tenant-backend:${BACKEND_IMAGE_TAG:-latest}
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-platform}
      DB_USERNAME: ${DB_USERNAME:-platform}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:?set PLATFORM_ROOT_DOMAIN in .env}
      PLATFORM_EDGE_HOST: ${PLATFORM_EDGE_HOST:?set PLATFORM_EDGE_HOST in .env}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PLATFORM_ADMIN_PHONE: ${PLATFORM_ADMIN_PHONE:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?set BILLING_WEBHOOK_SECRET in .env}
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-public-media}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-private-medical}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=70}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf \"GET /actuator/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    image: ghcr.io/m-elnemr/multi_tenant-web:${WEB_IMAGE_TAG:-latest}
    build: ./web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_BASE_URL: http://backend:8080
      SESSION_SECRET: ${WEB_SESSION_SECRET:?set WEB_SESSION_SECRET in .env}
    expose:
      - "3000"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # S3-compatible object storage. MinIO's community project stopped publishing prebuilt binaries/images in 2025: set MINIO_IMAGE to an image you
  # build or trust, or point the S3_* variables at any other S3-compatible store (Garage, Cloudflare R2, AWS S3) and drop these two services.
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -fs http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: ${MC_IMAGE:-quay.io/minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-public-media}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-private-medical}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro

  caddy:
    image: ghcr.io/m-elnemr/multi_tenant-caddy:${CADDY_IMAGE_TAG:-latest}
    build: ./infra/caddy
    restart: unless-stopped
    depends_on:
      - backend
      - web
      - minio
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:?set PLATFORM_ROOT_DOMAIN in .env}
      CF_API_TOKEN: ${CF_API_TOKEN:?set CF_API_TOKEN in .env (Cloudflare token with Zone:DNS:Edit)}
      S3_PUBLIC_BUCKET: ${S3_PUBLIC_BUCKET:-public-media}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    # Defaults suit a dedicated server. On a server whose ports 80/443 are taken, see docs/DEPLOY.md (EDGE_HTTP_PORT / EDGE_HTTPS_PORT).
    ports:
      - "${EDGE_HTTP_BIND:-0.0.0.0}:${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_BIND:-0.0.0.0}:${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  minio_data:
  caddy_data:
  caddy_config:
