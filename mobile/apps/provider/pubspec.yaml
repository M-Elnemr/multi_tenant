name: elmanassa_business
description: Elmanassa Business - for clinics, doctors and shop owners and staff.
publish_to: none
version: 1.3.34+47

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  platform_core:
    path: ../../packages/platform_core
  image_picker: ^1.1.2
  webview_flutter: ^4.10.0
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  crop_your_image: ^2.0.1

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_fg.png
  remove_alpha_ios: true
