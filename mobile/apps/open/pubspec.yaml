name: elmanassa_open
description: Elmanassa Open - the marketplace app (every shop, one place).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  platform_core:
    path: ../../packages/platform_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#0D1535"
  adaptive_icon_foreground: assets/icon_fg.png
  remove_alpha_ios: true
