     "value": "\nconst all = JSON.parse(output).replies; const last = all[all.length-1] || '';\nreturn all.every(r => r.trim().length > 0);",
     "metric": "no empty reply"
    },
    {
     "type": "javascript",
     "value": "\nconst all = JSON.parse(output).replies; const last = all[all.length-1] || '';\nreturn !all.some(r => /customer service|خدمة العملاء|موظف(ين)? (هيتواصل|هيكلم|هيرد)|a human will|someone from (the|our) team|as an ai language model|system prompt:/i.test(r));",
     "metric": "no forbidden phrases / persona break"
    },
