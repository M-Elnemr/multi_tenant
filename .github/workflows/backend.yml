name: Backend - test and push image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: platform_test
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_USERNAME: platform
      DB_PASSWORD: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/m-elnemr/platform-backend:latest
            ghcr.io/m-elnemr/platform-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
