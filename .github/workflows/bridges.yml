name: Bridges - test and push ig-bridge / fb-bridge images

on:
  push:
    branches: [main]
    paths: ["infra/ig-bridge/**", "infra/fb-bridge/**", ".github/workflows/bridges.yml"]
  pull_request:
    paths: ["infra/ig-bridge/**", "infra/fb-bridge/**"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bridge: [ig-bridge, fb-bridge]
    defaults:
      run:
        working-directory: infra/${{ matrix.bridge }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt httpx==0.28.1
      - run: python -m pytest -q

  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        bridge: [ig-bridge, fb-bridge]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./infra/${{ matrix.bridge }}
          push: true
          tags: |
            ghcr.io/m-elnemr/multi_tenant-${{ matrix.bridge }}:latest
            ghcr.io/m-elnemr/multi_tenant-${{ matrix.bridge }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.bridge }}
          cache-to: type=gha,mode=max,scope=${{ matrix.bridge }}
