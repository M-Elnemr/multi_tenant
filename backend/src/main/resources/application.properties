spring.application.name=platform

# Every request DTO is a Java record; keep omitted optional primitives falling back to defaults.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:platform_dev}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA / Hibernate --- Flyway owns the schema; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Proxy headers (backend is only reachable through the reverse proxy) ---
server.forward-headers-strategy=none
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# --- Platform / tenancy ---
# Root domain tenants get subdomains of: <slug>.<root-domain>. Locally *.localtest.me resolves to 127.0.0.1.
app.platform.root-domain=${PLATFORM_ROOT_DOMAIN:platform.localtest.me}
# Hosts of the platform itself (marketing site, signup, platform admin) - comma separated, in addition to root-domain.
app.platform.extra-hosts=${PLATFORM_EXTRA_HOSTS:localhost,127.0.0.1}
# Trust X-Forwarded-Host (set by our reverse proxy / Next.js server) when resolving the tenant.
app.platform.trust-forwarded-host=${TRUST_FORWARDED_HOST:true}
# CNAME target shown to tenants adding a custom domain.
app.platform.edge-host=${PLATFORM_EDGE_HOST:edge.platform.localtest.me}
app.platform.trial-days=14

# --- Auth / JWT --- base64 key >= 256 bits. Generate with: openssl rand -base64 32
app.jwt.secret=${JWT_SECRET:Q0hBTkdFX01FX2Rldl9vbmx5X3NlY3JldF9DSEFOR0VfTUVfZGV2X29ubHk=}
app.jwt.access-token-ttl=PT15M
app.jwt.refresh-token-ttl=P30D
app.auth.activation-pin-ttl=P7D
app.auth.max-activation-attempts=5

# --- CORS ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
