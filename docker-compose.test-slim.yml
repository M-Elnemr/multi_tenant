# Personal test on a small shared server (about 1 GB of spare RAM). Plain HTTP, local-disk images, no Redis/MinIO/Caddy-with-TLS.
#   docker compose -p multitenant -f docker-compose.yml -f docker-compose.test-slim.yml up -d
# Every container gets a high oom_score_adj: if the machine runs out of memory the kernel stops THESE first, never the other projects.
# Not for customers or real patient data. Production layouts: docs/DEPLOY.md.
services:
  db:
    command: ["postgres", "-c", "shared_buffers=96MB", "-c", "effective_cache_size=256MB", "-c", "max_connections=40", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB", "-c", "random_page_cost=1.1"]
    mem_limit: 256m
    oom_score_adj: 900
    cpus: 0.3

  backend:
    depends_on: !override
      db:
        condition: service_healthy
    environment:
      STORAGE_TYPE: local
      APP_FILES_DIR: /app/uploads
      REDIS_ENABLED: "false"
      APP_MARKETING_VIDEO_ENABLED: "true"
      APP_MARKETING_VIDEO_DIR: /app/uploads/reels
      DB_POOL_SIZE: "6"
      DB_POOL_MIN_IDLE: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      GLM_MODEL: ${GLM_MODEL:-zai-org/glm-5.3-flash}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://api-cdn.thehive.ai/api/v3}
      GLM_REASONING_EFFORT: ${GLM_REASONING_EFFORT:-low}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.7-flash}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
      QWEN_THINKING: ${QWEN_THINKING:-off}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-low}
      AI_PRICE_ANTHROPIC_INPUT: ${AI_PRICE_ANTHROPIC_INPUT:-0.10}
      AI_PRICE_ANTHROPIC_OUTPUT: ${AI_PRICE_ANTHROPIC_OUTPUT:-0.50}
      AI_PRICE_ANTHROPIC_CACHED: ${AI_PRICE_ANTHROPIC_CACHED:-0.01}
      AI_PRICE_ANTHROPIC_CACHE_WRITE: ${AI_PRICE_ANTHROPIC_CACHE_WRITE:-0.20}
      AI_ROUTE_SOCIAL: ${AI_ROUTE_SOCIAL:-default}
      AI_ROUTE_WEB: ${AI_ROUTE_WEB:-default}
      AI_NAME_PROBE: ${AI_NAME_PROBE:-false}
      AI_REVIEW: ${AI_REVIEW:-true}
      CHAT_BURST_MS: ${CHAT_BURST_MS:-5000}
      EVOLUTION_BASE_URL: ${EVOLUTION_BASE_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--Xmx320m -Xss512k -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m}
    volumes:
      - uploads:/app/uploads
    mem_limit: 560m
    oom_score_adj: 900
    cpus: 0.5

  web:
    environment:
      SESSION_SECURE: ${TEST_SESSION_SECURE:-false}
      NODE_OPTIONS: --max-old-space-size=150
    mem_limit: 220m
    oom_score_adj: 900
    cpus: 0.3

  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web
    volumes:
      - ./infra/caddy/Caddyfile.test:/etc/caddy/Caddyfile:ro
    ports:
      - "${TEST_EDGE_BIND:-0.0.0.0}:${TEST_EDGE_PORT:-8081}:80"
    mem_limit: 48m
    oom_score_adj: 900
    cpus: 0.1

  # Optional unofficial WhatsApp mode (Evolution API, Baileys). Reachable only from the backend inside this network (no published port). Uses its own database "evolution" in the same
  # Postgres, local cache (no Redis). Start with: docker compose ... up -d evolution. Create the database once: CREATE DATABASE evolution;
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?set EVOLUTION_API_KEY in .env}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USERNAME:-platform}:${DB_PASSWORD}@db:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Elmanassa
      CONFIG_SESSION_PHONE_NAME: Chrome
      TELEMETRY: "false"
      TELEMETRY_ENABLED: "false"
      LOG_LEVEL: ERROR,WARN
      DEL_INSTANCE: "false"
      NODE_OPTIONS: --max-old-space-size=300
    mem_limit: 420m
    oom_score_adj: 900
    cpus: 0.4

  # Not started in this profile (docker compose only starts services whose profiles are active).
  redis:
    profiles: ["full"]
  minio:
    profiles: ["full"]
  minio-init:
    profiles: ["full"]
  caddy:
    profiles: ["full"]

volumes:
  uploads:
