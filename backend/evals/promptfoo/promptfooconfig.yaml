     "type": "javascript",
     "value": "\nconst all = JSON.parse(output).replies; const last = all[all.length-1] || '';\nreturn all.every(r => r.length <= 900 && (r.match(/[؟?]/g)||[]).length <= 3);",
     "metric": "short enough (<=900 chars) and <=3 questions"
    },
    {
