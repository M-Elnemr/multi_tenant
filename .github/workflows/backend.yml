name: Backend - test and push image

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine
        env:
          POSTGRES_DB: platform_test
          POSTGRES_USER: platform
          POSTGRES_PASSWORD: platform
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U platform -d platform_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_USERNAME: platform
      DB_PASSWORD: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test servers (S3-compatible moto, fakeredis) for the storage and Redis tests
        run: |
          python -m venv /tmp/moto
          /tmp/moto/bin/pip install -q "moto[server]" fakeredis
          echo "MOTO_SERVER_BIN=/tmp/moto/bin/moto_server" >> "$GITHUB_ENV"
          echo "REDIS_SERVER_PYTHON=/tmp/moto/bin/python" >> "$GITHUB_ENV"
      - name: Run tests
        working-directory: backend
        run: ./gradlew test --no-daemon
      # Failing tests become annotations on the run (readable through the API without admin rights), so a red build says WHICH test and why.
      - name: Report failing tests as annotations
        if: failure()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import glob, html, re
          n = 0
          for f in glob.glob('build/test-results/test/*.xml'):
              s = open(f, encoding='utf-8').read()
              for m in re.finditer(r'<testcase name="([^"]+)" classname="([^"]+)"[^>]*>\s*<failure message="([^"]{0,700})', s):
                  msg = html.unescape(m.group(3)).replace('\n', ' ').replace('\r', ' ')[:600]
                  print('::error title=TEST FAILED %s.%s::%s' % (m.group(2).split('.')[-1], m.group(1), msg))
                  n += 1
          print('%d failing tests' % n)
          PY

  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/m-elnemr/multi_tenant-backend:latest
            ghcr.io/m-elnemr/multi_tenant-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
