name: elmanassa
description: Tabib - the patient app (queue, medical record, tests and prescriptions).
publish_to: none
version: 1.3.5+15

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  google_sign_in: ^6.2.2
  shared_preferences: ^2.3.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6
  platform_core:
    path: ../../packages/platform_core
  qr_flutter: ^4.1.0
dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_fg.png
  remove_alpha_ios: true
