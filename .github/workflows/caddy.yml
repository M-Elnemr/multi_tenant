name: Edge - build and push Caddy image

on:
  push:
    branches: [main]
    paths: ["infra/caddy/**", ".github/workflows/caddy.yml"]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./infra/caddy
          push: true
          tags: |
            ghcr.io/m-elnemr/multi_tenant-caddy:latest
            ghcr.io/m-elnemr/multi_tenant-caddy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
